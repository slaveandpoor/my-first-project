<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>專屬雲端看盤與畫線系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #131722;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header {
      flex: 0 0 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background-color: #1e222d;
      border-bottom: 1px solid #2a2e39;
      gap: 10px;
    }
    .title-area { display: flex; align-items: center; gap: 10px; }
    h1 { font-size: 15px; font-weight: 600; color: #ffffff; white-space: nowrap; }
    #status-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      background-color: #2a2e39;
      color: #4caf50;
      max-width: 45vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    select, button {
      background-color: #2a2e39;
      color: #d1d4dc;
      border: 1px solid #363a45;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    button:hover { background-color: #363a45; }
    button.active { background-color: #2962ff; color: #fff; border-color: #2962ff; }
    button.danger { background-color: #b22833; color: #fff; border-color: #b22833; }
    #chart-container {
      flex: 1 1 auto;
      width: 100%;
      position: relative;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-area">
      <h1>📈 專屬看盤</h1>
      <select id="symbol-select">
        <option value="BTCUSDT">BTC / USDT</option>
        <option value="ETHUSDT">ETH / USDT</option>
        <option value="SOLUSDT">SOL / USDT</option>
      </select>
      <span id="status-badge">⏳ 初始化中...</span>
    </div>
    <div class="tools">
      <button id="draw-hline-btn">➕ 畫水平線</button>
      <button id="clear-lines-btn" class="danger">🗑️ 清除</button>
    </div>
  </header>

  <div id="chart-container"></div>

  <script>
    const statusBadge = document.getElementById('status-badge');
    const cdnList = [
      'https://' + 'cdn.jsdelivr.net' + '/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js',
      'https://' + 'unpkg.com' + '/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js',
      'https://' + '://cloudflare.com' + '/ajax/libs/lightweight-charts/4.2.0/lightweight-charts.standalone.production.js'
    ];

    function loadScriptWithFallback(index = 0) {
      if (index >= cdnList.length) {
        statusBadge.style.color = '#ef5350';
        statusBadge.textContent = '❌ 所有圖表 CDN 皆被網路阻擋';
        return;
      }
      statusBadge.textContent = `⏳ 載入圖表引擎 (${index + 1}/${cdnList.length})...`;
      const s = document.createElement('script');
      s.src = cdnList[index];
      s.onload = () => initApp();
      s.onerror = () => loadScriptWithFallback(index + 1);
      document.head.appendChild(s);
    }

    loadScriptWithFallback(0);

    function initApp() {
      const chartContainer = document.getElementById('chart-container');
      const symbolSelect = document.getElementById('symbol-select');
      const drawBtn = document.getElementById('draw-hline-btn');
      const clearBtn = document.getElementById('clear-lines-btn');

      let isDrawMode = false;
      let priceLines = [];
      let currentSymbol = symbolSelect.value;

      const chart = LightweightCharts.createChart(chartContainer, {
        width: chartContainer.clientWidth || window.innerWidth,
        height: chartContainer.clientHeight || (window.innerHeight - 52),
        layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#2a2e39' },
        timeScale: { borderColor: '#2a2e39', timeVisible: true },
      });

      const candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350',
      });

      function getStorageKey() { return `chart_lines_${currentSymbol}`; }

      function saveLinesToLocal() {
        const prices = priceLines.map(line => line.options().price);
        localStorage.setItem(getStorageKey(), JSON.stringify(prices));
      }

      function addHorizontalLine(price, save = true) {
        const line = candleSeries.createPriceLine({
          price: price,
          color: '#2962ff',
          lineWidth: 2,
          lineStyle: LightweightCharts.LineStyle.Solid,
          axisLabelVisible: true,
          title: '支撐/壓力',
        });
        priceLines.push(line);
        if (save) saveLinesToLocal();
      }

      function clearAllLines(clearStorage = true) {
        priceLines.forEach(line => candleSeries.removePriceLine(line));
        priceLines = [];
        if (clearStorage) localStorage.removeItem(getStorageKey());
      }

      function loadSavedLines() {
        clearAllLines(false);
        const saved = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
        saved.forEach(price => addHorizontalLine(price, false));
      }

      async function loadMarketData(symbol) {
        statusBadge.style.color = '#ffeb3b';
        statusBadge.textContent = `⏳ 讀取 ${symbol} 行情...`;
        const endpoints = [
          'https://' + '://binance.com' + `/api/v3/klines?symbol=${symbol}&interval=1h&limit=200`,
          'https://' + 'data-api.binance.vision' + `/api/v3/klines?symbol=${symbol}&interval=1h&limit=200`
        ];

        for (const url of endpoints) {
          try {
            const res = await fetch(url);
            if (!res.ok) continue;
            const data = await res.json();
            const candles = data.map(item => ({
              time: Number(item.at(0)) / 1000,
              open: Number(item.at(1)),
              high: Number(item.at(2)),
              low: Number(item.at(3)),
              close: Number(item.at(4)),
            }));
            candleSeries.setData(candles);
            chart.timeScale().fitContent();
            loadSavedLines();
            statusBadge.style.color = '#4caf50';
            statusBadge.textContent = `✅ ${symbol} (1H) | ${priceLines.length} 條線`;
            return;
          } catch (e) {}
        }
        statusBadge.style.color = '#ef5350';
        statusBadge.textContent = '❌ 行情 API 無法連線';
      }

      drawBtn.addEventListener('click', () => {
        isDrawMode = !isDrawMode;
        drawBtn.classList.toggle('active', isDrawMode);
        statusBadge.style.color = isDrawMode ? '#2962ff' : '#4caf50';
        statusBadge.textContent = isDrawMode ? '🟢 請點擊圖表價位畫線' : `✅ ${currentSymbol} (1H) | ${priceLines.length} 條線`;
      });

      clearBtn.addEventListener('click', () => {
        clearAllLines(true);
        statusBadge.textContent = `🗑️ 已清除所有線條`;
      });

      chart.subscribeClick((param) => {
        if (!isDrawMode || !param.point) return;
        const price = candleSeries.coordinateToPrice(param.point.y);
        if (price !== null) {
          addHorizontalLine(Number(price.toFixed(2)), true);
          isDrawMode = false;
          drawBtn.classList.remove('active');
          statusBadge.style.color = '#4caf50';
          statusBadge.textContent = `✅ 已畫線 @ ${price.toFixed(2)}`;
        }
      });

      symbolSelect.addEventListener('change', (e) => {
        currentSymbol = e.target.value;
        loadMarketData(currentSymbol);
      });

      window.addEventListener('resize', () => {
        chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
      });

      loadMarketData(currentSymbol);
    }
  </script>
</body>
</html>
