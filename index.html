<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全球看盤</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #131722;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "PingFang TC", sans-serif;
      overflow: hidden;
    }

    #app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* 頂部工具列 */
    #top-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #1a1f2e;
      border-bottom: 1px solid #2a2e39;
      z-index: 20;
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      margin-right: 2px;
      white-space: nowrap;
    }

    select, input[type="text"], button {
      background: #252b3d;
      color: #e5e7eb;
      border: 1px solid #363d52;
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 12px;
      height: 28px;
    }
    select:focus, input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: #2962ff;
    }
    button {
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover:not(:disabled) {
      background: #313950;
      border-color: #4b5575;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.active {
      background: #2962ff;
      border-color: #4c7dff;
      color: #fff;
      font-weight: 600;
    }
    button.danger {
      border-color: #7f2d36;
      color: #ff8a93;
    }
    button.danger:hover:not(:disabled) {
      background: #4a1c22;
    }

    #custom-symbol { width: 96px; }
    #rect-ratios { width: 96px; }
    input[type="color"] {
      width: 28px;
      height: 28px;
      padding: 1px;
      border: 1px solid #363d52;
      border-radius: 5px;
      background: #252b3d;
      cursor: pointer;
    }

    .toolbar-sep {
      width: 1px;
      height: 18px;
      background: #2f3547;
      margin: 0 2px;
    }

    .chk-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #d1d4dc;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .chk-label input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
    }

    #status-badge {
      margin-left: auto;
      font-size: 12px;
      color: #4caf50;
      white-space: nowrap;
      padding: 2px 6px;
    }

    /* 圖表主區域 */
    #charts-wrapper {
      position: relative;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      width: 100%;
    }

    #chart-container {
      position: relative;
      width: 100%;
      flex: 3.4 1 0;
      min-height: 70px;
    }

    #volume-container {
      position: relative;
      width: 100%;
      flex: 1 1 0;
      min-height: 45px;
    }

    #sub-indicator-container {
      position: relative;
      width: 100%;
      flex: 1.25 1 0;
      min-height: 45px;
    }

    /* 窗格分隔拖曳條 */
    .pane-resizer {
      height: 5px;
      width: 100%;
      background: #1e222d;
      cursor: ns-resize;
      flex-shrink: 0;
      position: relative;
      z-index: 15;
      transition: background 0.15s;
    }
    .pane-resizer:hover, .pane-resizer.dragging {
      background: #2962ff;
    }

    /* 繪圖覆蓋畫布 */
    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* 圖例文字 */
    .legend-box {
      position: absolute;
      top: 6px;
      left: 8px;
      z-index: 12;
      font-size: 11px;
      line-height: 1.45;
      color: #d1d4dc;
      background: rgba(19, 23, 34, 0.55);
      padding: 3px 6px;
      border-radius: 4px;
      pointer-events: none;
      max-width: calc(100% - 92px);
    }

    /* 雲端繪圖清單側邊抽屜 */
    #drawings-panel {
      position: fixed;
      top: 42px;
      right: 12px;
      width: 310px;
      max-height: calc(100vh - 60px);
      background: #1b2030;
      border: 1px solid #343b52;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      display: none;
      flex-direction: column;
      z-index: 40;
    }
    #drawings-panel.open { display: flex; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-bottom: 1px solid #2c3347;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .panel-body {
      padding: 8px;
      overflow-y: auto;
      flex: 1;
    }
    .panel-footer {
      padding: 8px 10px;
      border-top: 1px solid #2c3347;
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .draw-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .draw-item:hover { background: #242b40; }
    .draw-item.selected {
      background: rgba(41, 98, 255, 0.22);
      border-color: #2962ff;
    }
    .draw-item-info {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .item-del-btn {
      height: 22px;
      padding: 0 7px;
      font-size: 11px;
    }

    /* 註記 Modal 與 自選管理 Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60;
      padding: 14px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 400px;
      background: #1b2030;
      border: 1px solid #353d56;
      border-radius: 8px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-card.wl-modal-card {
      max-width: 680px;
      max-height: 86vh;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #2c3347;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .modal-body {
      padding: 12px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid #2c3347;
    }
    #note-textarea {
      width: 100%;
      min-height: 96px;
      background: #131722;
      color: #e5e7eb;
      border: 1px solid #363d52;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      resize: vertical;
    }

    /* 自選族群管理樣式 */
    .wl-toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      background: #151926;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #293044;
    }
    .wl-group-card {
      background: #151926;
      border: 1px solid #2b3247;
      border-radius: 6px;
      padding: 8px 10px;
    }
    .wl-group-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-bottom: 6px;
      margin-bottom: 6px;
      border-bottom: 1px solid #252c3f;
    }
    .wl-group-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .wl-group-actions, .wl-item-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }
    .wl-items {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .wl-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 8px;
      background: #1d2334;
      border-radius: 4px;
      font-size: 12px;
    }
    .wl-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .wl-sym-badge {
      background: #2a334d;
      color: #90caf9;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .wl-sym-badge:hover {
      background: #2962ff;
      color: #fff;
    }
    .wl-name-text {
      color: #e5e7eb;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }
    .wl-name-text:hover {
      color: #ffeb3b;
      text-decoration: underline;
    }
    .wl-mini-btn {
      height: 22px;
      padding: 0 6px;
      font-size: 11px;
    }
    .wl-empty-tip {
      font-size: 12px;
      color: #8b90a0;
      padding: 6px 4px;
    }

    @media (max-width: 768px) {
      #top-toolbar { padding: 5px 6px; gap: 4px; }
      select, input[type="text"], button { height: 26px; font-size: 11px; padding: 2px 6px; }
      #custom-symbol { width: 78px; }
      #rect-ratios { width: 76px; }
      #status-badge { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <div id="top-toolbar">
      <span class="brand-title">📈 全球看盤</span>

      <select id="symbol-select" title="選擇自選股票 / 指數">
        <option value="2330.TW">台積電 (2330.TW)</option>
      </select>

      <input type="text" id="custom-symbol" placeholder="代號(如2330)" />
      <button id="search-btn" type="button">查詢</button>
      <button id="fav-btn" type="button" title="加入或移除目前標的至自選">⭐ 自選</button>
      <button id="manage-fav-btn" type="button" title="管理自選分類族群、排序與命名">🗂️ 自選管理</button>

      <select id="interval-select" title="週期">
        <option value="1d" selected>日線K</option>
        <option value="1wk">週線K</option>
        <option value="1mo">月線K</option>
        <option value="60m">60分K</option>
      </select>

      <div class="toolbar-sep"></div>

      <label class="chk-label"><input type="checkbox" id="toggle-ma" checked /> 均線</label>
      <label class="chk-label"><input type="checkbox" id="toggle-bb" checked /> 布林</label>
      <label class="chk-label"><input type="checkbox" id="toggle-deduct" checked /> 扣抵</label>

      <div class="toolbar-sep"></div>

      <select id="draw-tool-select" title="繪圖工具">
        <option value="hline">水平切線</option>
        <option value="vline">垂直切線</option>
        <option value="trend">兩點切線</option>
        <option value="ray">兩點雙向延長切線</option>
        <option value="ellipse">橢圓形</option>
        <option value="rect">四方形(倍數)</option>
        <option value="measure">起終點量測</option>
        <option value="textBox">註記框</option>
      </select>

      <input type="text" id="rect-ratios" value="0.333, 0.5, 0.6667" title="四方形倍數線比例" />

      <select id="color-select" title="預設顏色">
        <option value="#2962ff" selected>藍色</option>
        <option value="#ef5350">紅色</option>
        <option value="#26a69a">綠色</option>
        <option value="#ffeb3b">黃色</option>
        <option value="#ff9800">橘色</option>
        <option value="#e040fb">紫色</option>
        <option value="#ffffff">白色</option>
      </select>
      <input type="color" id="custom-color" value="#2962ff" title="自訂顏色" />

      <select id="line-width-select" title="線條粗細">
        <option value="1">1px</option>
        <option value="2" selected>2px</option>
        <option value="3">3px</option>
        <option value="4">4px</option>
        <option value="5">5px</option>
      </select>

      <button id="draw-btn" type="button">✏️ 繪圖</button>
      <button id="delete-selected-btn" type="button" disabled>🗑️ 刪選取</button>
      <button id="manage-list-btn" type="button">📋 圖層</button>
      <button id="clear-lines-btn" type="button" class="danger">🧹 清空</button>

      <span id="status-badge">⏳ 載入中...</span>
    </div>

    <div id="charts-wrapper">
      <div id="chart-container">
        <div id="ohlc-legend" class="legend-box"></div>
        <canvas id="draw-canvas"></canvas>
      </div>
      <div id="resizer-main-vol" class="pane-resizer" title="拖曳調整主圖與成交量高度"></div>
      <div id="volume-container">
        <div id="vol-legend" class="legend-box"></div>
      </div>
      <div id="resizer-vol-sub" class="pane-resizer" title="拖曳調整成交量與附圖指標高度"></div>
      <div id="sub-indicator-container">
        <div id="sub-legend" class="legend-box"></div>
      </div>
    </div>
  </div>

  <!-- 雲端繪圖圖層管理抽屜 -->
  <div id="drawings-panel">
    <div class="panel-header">
      <span>📋 雲端繪圖圖層</span>
      <button id="close-panel-btn" type="button" class="item-del-btn">✕</button>
    </div>
    <div id="drawings-list" class="panel-body"></div>
    <div class="panel-footer">
      <button id="del-checked-btn" type="button" class="danger item-del-btn">刪除勾選</button>
    </div>
  </div>

  <!-- 文字/數字註記 Modal -->
  <div id="text-modal-backdrop" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <span id="text-modal-title">💬 文字 / 數字註記</span>
      </div>
      <div class="modal-body">
        <textarea id="note-textarea" placeholder="輸入註記內容（支援多行，Ctrl/Cmd + Enter 儲存）"></textarea>
      </div>
      <div class="modal-footer">
        <button id="note-cancel-btn" type="button">取消</button>
        <button id="note-confirm-btn" type="button" class="active">確定</button>
      </div>
    </div>
  </div>

  <!-- 自選分類、排序與命名管理 Modal -->
  <div id="watchlist-modal-backdrop" class="modal-backdrop">
    <div class="modal-card wl-modal-card">
      <div class="modal-header">
        <span>🗂️ 自選名單分類、排序與命名</span>
        <button id="close-wl-btn" type="button" class="item-del-btn">✕</button>
      </div>
      <div class="modal-body">
        <!-- 新增族群 -->
        <div class="wl-toolbar-row">
          <input type="text" id="wl-new-group-input" placeholder="新族群名稱 (如: 台股權值)" style="flex:1; min-width:140px;" />
          <button id="wl-add-group-btn" type="button" class="active">＋ 新增族群</button>
        </div>

        <!-- 新增股票至指定族群 -->
        <div class="wl-toolbar-row">
          <input type="text" id="wl-add-sym-input" placeholder="代號 (如 NVDA 或 2330)" style="width:130px;" />
          <input type="text" id="wl-add-name-input" placeholder="自訂顯示名稱 (可留空)" style="flex:1; min-width:130px;" />
          <select id="wl-target-group-select" title="選擇加入的族群"></select>
          <button id="wl-add-item-btn" type="button">＋ 加入清單</button>
        </div>

        <!-- 各族群列表 -->
        <div id="watchlist-groups-container" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>
      <div class="modal-footer">
        <span style="margin-right:auto; font-size:11px; color:#9598a1;">💡 點擊代號可直接看盤；點擊名稱可重新命名；支援上下排序與跨族群移動。</span>
      </div>
    </div>
  </div>

  <script src="./data.js?v=40"></script>
  <script src="./app.js?v=40"></script>
</body>
</html>
