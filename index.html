<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全球雲端看盤與畫線系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #131722; color: #d1d4dc; font-family: sans-serif; display: flex; flex-direction: column; }
    header { flex: 0 0 auto; min-height: 52px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 8px 14px; background: #1e222d; border-bottom: 1px solid #2a2e39; gap: 8px; }
    .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    h1 { font-size: 15px; color: #fff; }
    #status-badge { font-size: 12px; padding: 4px 10px; border-radius: 4px; background: #2a2e39; color: #4caf50; }
    select, input, button { background: #2a2e39; color: #d1d4dc; border: 1px solid #363a45; padding: 5px 8px; border-radius: 4px; font-size: 13px; }
    input { width: 110px; }
    button { cursor: pointer; }
    button.active { background: #2962ff; color: #fff; }
    button.danger { background: #b22833; color: #fff; }
    #chart-container { flex: 1 1 auto; width: 100%; position: relative; }
  </style>
</head>
<body>
  <header>
    <div class="group">
      <h1>📈 全球看盤</h1>
      <select id="symbol-select">
        <optgroup label="🌐 全球指數">
          <option value="^TWII">台灣加權 (^TWII)</option>
          <option value="^GSPC">標普500 (^GSPC)</option>
          <option value="^IXIC">那斯達克 (^IXIC)</option>
          <option value="^SOX">費半 (^SOX)</option>
          <option value="^N225">日經225 (^N225)</option>
        </optgroup>
        <optgroup label="🇹🇼 台股/ETF">
          <option value="2330.TW" selected>台積電 (2330.TW)</option>
          <option value="2317.TW">鴻海 (2317.TW)</option>
          <option value="2454.TW">聯發科 (2454.TW)</option>
          <option value="0050.TW">元大台灣50 (0050.TW)</option>
          <option value="00878.TW">國泰高股息 (00878.TW)</option>
          <option value="8069.TWO">元太-上櫃 (8069.TWO)</option>
        </optgroup>
        <optgroup label="🇺🇸 美股/ETF">
          <option value="NVDA">NVIDIA (NVDA)</option>
          <option value="AAPL">Apple (AAPL)</option>
          <option value="TSLA">Tesla (TSLA)</option>
          <option value="SPY">SPY ETF</option>
          <option value="QQQ">QQQ ETF</option>
        </optgroup>
        <optgroup label="🪙 加密貨幣">
          <option value="BTCUSDT">BTC/USDT</option>
          <option value="ETHUSDT">ETH/USDT</option>
          <option value="SOLUSDT">SOL/USDT</option>
        </optgroup>
      </select>
      <input id="custom-symbol" type="text" placeholder="如 2603.TW" />
      <button id="search-btn">查詢</button>
      <select id="interval-select"><option value="15m">15分K</option><option value="1h">1小時K</option><option value="1d" selected>日K</option></select>
      <span id="status-badge">⏳ 啟動中...</span>
    </div>
    <div class="group">
      <select id="color-select"><option value="#2962ff">🔵 藍線</option><option value="#26a69a">🟢 綠線</option><option value="#ef5350">🔴 紅線</option><option value="#ffeb3b">🟡 黃線</option></select>
      <button id="draw-hline-btn">➕ 畫水平線</button>
      <button id="clear-lines-btn" class="danger">🗑️ 清除雲端</button>
    </div>
  </header>
  <div id="chart-container"></div>
  <script src="./app.js"></script>
</body>
</html>
