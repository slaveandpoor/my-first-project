<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>全球全市場雲端看盤系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background: #131722; color: #d1d4dc; font-family: sans-serif; display: flex; flex-direction: column; }
    header { flex: 0 0 auto; min-height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 4px 10px; background: #1e222d; border-bottom: 1px solid #2a2e39; gap: 6px; overflow: hidden; }
    .group { display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; min-width: 0; }
    h1 { font-size: 14px; color: #fff; white-space: nowrap; }
    #status-badge { font-size: 12px; padding: 3px 8px; border-radius: 4px; background: #2a2e39; color: #4caf50; max-width: 210px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    select, input, button { background: #2a2e39; color: #d1d4dc; border: 1px solid #363a45; padding: 3px 6px; border-radius: 4px; font-size: 12px; white-space: nowrap; }
    select#symbol-select { max-width: 155px; }
    select#line-width-select { width: 72px; }
    input#custom-symbol { width: 105px; }
    input#rect-ratios { width: 110px; font-size: 11px; }
    input[type="color"] { width: 28px; height: 24px; padding: 1px; cursor: pointer; }
    button { cursor: pointer; }
    button.active { background: #2962ff; color: #fff; border-color: #2962ff; }
    button.danger { background: #b22833; color: #fff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    label.chk { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; background: #2a2e39; border: 1px solid #363a45; padding: 3px 6px; border-radius: 4px; cursor: pointer; user-select: none; white-space: nowrap; }
    label.chk input { width: auto; margin: 0; }

    #charts-wrapper { flex: 1 1 auto; display: flex; flex-direction: column; width: 100%; min-height: 0; overflow: hidden; }
    #chart-container { flex: 3.4 1 0; width: 100%; min-height: 70px; position: relative; touch-action: none; }
    #draw-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; }
    #volume-container { flex: 1 1 0; width: 100%; min-height: 45px; position: relative; touch-action: none; }
    #sub-indicator-container { flex: 1.25 1 0; width: 100%; min-height: 45px; position: relative; touch-action: none; }

    .pane-resizer {
      flex: 0 0 6px;
      height: 6px;
      width: 100%;
      background: #1e222d;
      border-top: 1px solid #363a45;
      border-bottom: 1px solid #363a45;
      cursor: ns-resize;
      position: relative;
      z-index: 15;
      touch-action: none;
      transition: background 0.15s;
    }
    .pane-resizer::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 2px;
      border-radius: 2px;
      background: #5d606b;
    }
    .pane-resizer:hover, .pane-resizer.dragging {
      background: #2962ff;
    }
    .pane-resizer:hover::after, .pane-resizer.dragging::after {
      background: #ffffff;
    }

    #ohlc-legend { position: absolute; top: 8px; left: 10px; z-index: 10; font-size: 12px; background: rgba(19, 23, 34, 0.84); padding: 5px 9px; border-radius: 4px; pointer-events: none; line-height: 1.5; max-width: calc(100% - 92px); }
    #vol-legend { position: absolute; top: 4px; left: 10px; z-index: 10; font-size: 12px; background: rgba(19, 23, 34, 0.84); padding: 2px 8px; border-radius: 4px; pointer-events: none; color: #9598a1; max-width: calc(100% - 92px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sub-legend { position: absolute; top: 4px; left: 10px; z-index: 10; font-size: 12px; background: rgba(19, 23, 34, 0.84); padding: 2px 8px; border-radius: 4px; pointer-events: none; color: #d1d4dc; max-width: calc(100% - 92px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #drawings-panel {
      display: none;
      position: absolute;
      top: 10px;
      right: 86px;
      width: 340px;
      max-width: calc(100% - 100px);
      max-height: 70%;
      background: rgba(30, 34, 45, 0.96);
      border: 1px solid #363a45;
      border-radius: 6px;
      z-index: 20;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.55);
    }
    #drawings-panel.open { display: flex; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #363a45; font-size: 13px; font-weight: bold; color: #fff; }
    .panel-actions { display: flex; gap: 6px; padding: 6px 10px; border-bottom: 1px solid #2a2e39; background: #181c27; flex-wrap: wrap; }
    #drawings-list { overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
    .draw-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 8px; background: #242834; border: 1px solid #363a45; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .draw-item.selected { border-color: #2962ff; background: #233154; }
    .draw-item-info { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .color-dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; border: 1px solid rgba(255,255,255,0.4); }
    .item-del-btn { background: #8e2430; color: #fff; border: none; padding: 2px 7px; border-radius: 3px; font-size: 11px; }
    .item-del-btn:hover { background: #ef5350; }

    #text-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #text-modal-backdrop.open { display: flex; }
    #text-modal {
      width: 350px;
      max-width: 100%;
      background: #1e222d;
      border: 1px solid #363a45;
      border-radius: 6px;
      padding: 12px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #text-modal-title { font-size: 14px; color: #fff; }
    #note-textarea {
      width: 100%;
      min-height: 88px;
      background: #131722;
      color: #fff;
      border: 1px solid #363a45;
      border-radius: 4px;
      padding: 8px;
      font-size: 13px;
      line-height: 1.45;
      resize: vertical;
      white-space: pre-wrap;
    }
    .modal-hint { font-size: 11px; color: #9598a1; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }
    button.primary { background: #2962ff; color: #fff; border-color: #2962ff; }

    @media (max-width: 768px) {
      header {
        flex: 0 0 auto;
        height: auto;
        max-height: 84px;
        flex-direction: column;
        align-items: stretch;
        padding: 4px 6px;
        gap: 4px;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .group {
        gap: 4px;
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .group::-webkit-scrollbar { display: none; }
      h1 { font-size: 13px; }
      #status-badge { font-size: 11px; padding: 2px 6px; max-width: 135px; }
      select, input, button, label.chk { font-size: 11px; padding: 3px 5px; }
      select#symbol-select { max-width: 115px; }
      select#line-width-select { width: 64px; }
      input#custom-symbol { width: 78px; }
      input#rect-ratios { width: 88px; font-size: 10px; }
      input[type="color"] { width: 24px; height: 22px; }
      .pane-resizer { flex: 0 0 8px; height: 8px; }
      #ohlc-legend {
        top: 4px;
        left: 6px;
        font-size: 10.5px;
        line-height: 1.35;
        padding: 3px 6px;
        max-width: calc(100% - 68px);
      }
      #vol-legend, #sub-legend {
        top: 3px;
        left: 6px;
        font-size: 10.5px;
        padding: 2px 6px;
        max-width: calc(100% - 68px);
      }
      #drawings-panel {
        top: 6px;
        right: 64px;
        width: calc(100% - 74px);
        max-width: 300px;
        max-height: 75%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="group">
      <h1>📈 全球看盤</h1>
      <select id="symbol-select">
        <optgroup id="fav-group" label="⭐ 我的雲端自選股"></optgroup>
        <optgroup label="🇹🇼 台灣指數與熱門股">
          <option value="^TWII">台灣加權指數 (^TWII)</option>
          <option value="2330.TW" selected>台積電 (2330.TW)</option>
          <option value="0050.TW">元大台灣50 (0050.TW)</option>
          <option value="00878.TW">國泰永續高股息 (00878.TW)</option>
          <option value="8069.TWO">元太 (8069.TWO)</option>
          <option value="5347.TWO">世界 (5347.TWO)</option>
          <option value="4958.TW">臻鼎-KY (4958.TW)</option>
        </optgroup>
        <optgroup label="🇺🇸 美國指數與熱門股">
          <option value="^GSPC">標普 500 (^GSPC)</option>
          <option value="^IXIC">那斯達克綜合 (^IXIC)</option>
          <option value="^DJI">道瓊工業 (^DJI)</option>
          <option value="^SOX">費城半導體 (^SOX)</option>
          <option value="^VIX">VIX 恐慌指數 (^VIX)</option>
          <option value="NVDA">NVIDIA (NVDA)</option>
          <option value="SPY">SPY ETF</option>
          <option value="QQQ">QQQ ETF</option>
        </optgroup>
        <optgroup label="🌏 亞歐全球主要指數">
          <option value="^N225">日本日經 225 (^N225)</option>
          <option value="^KS11">韓國 KOSPI (^KS11)</option>
          <option value="^HSI">香港恆生指數 (^HSI)</option>
          <option value="000001.SS">中國上證指數 (000001.SS)</option>
          <option value="^GDAXI">德國 DAX (^GDAXI)</option>
          <option value="^FTSE">英國富時 100 (^FTSE)</option>
          <option value="^FCHI">法國 CAC 40 (^FCHI)</option>
        </optgroup>
        <optgroup label="🥇 黃金、石油與外匯匯率">
          <option value="GC=F">黃金 (GLD)</option>
          <option value="BZ=F">布蘭特原油 (BZ=F)</option>
          <option value="TWD=X">美元/台幣 (TWD=X)</option>
          <option value="JPY=X">美元/日圓 (JPY=X)</option>
          <option value="JPYTWD=X">日圓/台幣 相對匯率 (JPYTWD=X)</option>
        </optgroup>
        <optgroup label="🪙 加密貨幣">
          <option value="BTCUSDT">BTC / USDT</option>
          <option value="ETHUSDT">ETH / USDT</option>
        </optgroup>
      </select>
      <input id="custom-symbol" type="text" placeholder="代號(如4958)" />
      <button id="search-btn">查詢</button>
      <button id="fav-btn" title="加入或移除雲端自選">⭐ 自選</button>
      <select id="interval-select">
        <option value="60m">1小時K</option>
        <option value="1d" selected>日線K</option>
        <option value="1wk">週線K</option>
        <option value="1mo">月線K</option>
      </select>
      <span id="status-badge">⏳ 啟動中...</span>
    </div>
    <div class="group">
      <label class="chk"><input type="checkbox" id="toggle-ma" checked /> 均線</label>
      <label class="chk"><input type="checkbox" id="toggle-bb" checked /> 布林</label>
      <label class="chk"><input type="checkbox" id="toggle-deduct" checked /> 扣抵▲</label>
      <select id="color-select" title="選擇畫線顏色（已選取圖形時可即時變色）">
        <option value="#2962ff">🔵 藍</option>
        <option value="#26a69a">🟢 綠</option>
        <option value="#ef5350">🔴 紅</option>
        <option value="#ffeb3b">🟡 黃</option>
        <option value="#ffffff">⚪ 白</option>
        <option value="#e040fb">🟣 紫</option>
        <option value="#ff9800">🟠 橘</option>
      </select>
      <input type="color" id="custom-color" value="#2962ff" title="自訂任意顏色（已選取圖形時可即時變色）" />
      <select id="line-width-select" title="選擇線條/框線粗細（已選取圖形時可即時調整）">
        <option value="1">1px</option>
        <option value="2" selected>2px</option>
        <option value="3">3px</option>
        <option value="4">4px</option>
        <option value="5">5px</option>
        <option value="6">6px</option>
      </select>
      <select id="draw-tool-select" title="選擇畫圖工具">
        <option value="hline">➖ 水平切線</option>
        <option value="vline">｜ 垂直切線</option>
        <option value="trend">📈 兩點切線</option>
        <option value="ray">↗️ 兩點雙向延長切線</option>
        <option value="ellipse">⭕ 橢圓形</option>
        <option value="rect">⬜ 四方形(倍數)</option>
        <option value="measure">📏 起終點百分比/差值</option>
        <option value="textBox">💬 文字數字註記框</option>
      </select>
      <button id="draw-btn">➕ 畫圖</button>
      <input id="rect-ratios" type="text" value="0.333, 0.5, 0.6667" title="四方形倍數(由起點算，逗號分隔，按Enter即時更新)" placeholder="0.333,0.5,0.6667" />
      <button id="delete-selected-btn" class="danger" disabled title="刪除目前選取的線條/圖形 (Delete鍵)">❌ 刪選取</button>
      <button id="manage-list-btn" title="開啟繪圖清單">📋 清單</button>
      <button id="clear-lines-btn" class="danger" title="清除全部雲端繪圖">🗑️ 全清</button>
    </div>
  </header>
  <div id="charts-wrapper">
    <div id="chart-container">
      <div id="ohlc-legend">載入中...</div>
      <canvas id="draw-canvas"></canvas>
      <div id="drawings-panel">
        <div class="panel-header">
          <span>📋 雲端繪圖管理（點選高亮 / 單筆刪除）</span>
          <button id="close-panel-btn" style="padding:2px 6px;">✕</button>
        </div>
        <div class="panel-actions">
          <button id="del-checked-btn" class="danger" style="font-size:12px;">刪除已勾選</button>
          <span style="font-size:11px; color:#9598a1; align-self:center;">拖曳移動；雙擊註記框可編輯</span>
        </div>
        <div id="drawings-list"></div>
      </div>
    </div>
    <div id="resizer-main-vol" class="pane-resizer" title="上下拖曳調整主圖與成交量圖高度"></div>
    <div id="volume-container"><div id="vol-legend">成交量</div></div>
    <div id="resizer-vol-sub" class="pane-resizer" title="上下拖曳調整成交量圖與技術指標附圖高度"></div>
    <div id="sub-indicator-container"><div id="sub-legend">附圖指標</div></div>
  </div>

  <div id="text-modal-backdrop">
    <div id="text-modal">
      <h3 id="text-modal-title">💬 輸入文字 / 數字註記</h3>
      <textarea id="note-textarea" placeholder="可輸入任意文字、數字、價格、符號或換行內容..."></textarea>
      <div class="modal-hint">Ctrl/Cmd + Enter 快速儲存；留空儲存可刪除註記框</div>
      <div class="modal-btns">
        <button id="note-cancel-btn">取消</button>
        <button id="note-confirm-btn" class="primary">確定加入</button>
      </div>
    </div>
  </div>

  <script src="./data.js?v=40"></script>
  <script src="./app.js?v=40"></script>
</body>
</html>
