<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>專屬雲端看盤與畫線系統</title>
  <script src="https://unpkg.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #131722;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background-color: #1e222d;
      border-bottom: 1px solid #2a2e39;
    }
    .title-area { display: flex; align-items: center; gap: 12px; }
    h1 { font-size: 16px; font-weight: 600; color: #ffffff; }
    select, button {
      background-color: #2a2e39;
      color: #d1d4dc;
      border: 1px solid #363a45;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background-color: #363a45; }
    button.active { background-color: #2962ff; color: #fff; border-color: #2962ff; }
    button.danger { background-color: #b22833; color: #fff; border-color: #b22833; }
    #chart-container { flex: 1; width: 100%; position: relative; }
    .status-bar {
      padding: 6px 16px;
      font-size: 12px;
      background-color: #1e222d;
      border-top: 1px solid #2a2e39;
      color: #787b86;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-area">
      <h1>📈 專屬看盤系統</h1>
      <select id="symbol-select">
        <option value="BTCUSDT">BTC / USDT (加密貨幣)</option>
        <option value="ETHUSDT">ETH / USDT (加密貨幣)</option>
        <option value="SOLUSDT">SOL / USDT (加密貨幣)</option>
      </select>
    </div>
    <div class="tools">
      <button id="draw-hline-btn">➕ 點擊畫水平線</button>
      <button id="clear-lines-btn" class="danger">🗑️ 清除所有線條</button>
    </div>
  </header>

  <div id="chart-container"></div>

  <div class="status-bar">
    <span id="status-text">提示：點擊上方「點擊畫水平線」後，在圖表任意價位點擊即可畫線。</span>
    <span>儲存模式：本機暫存 (下一步升級雲端同步)</span>
  </div>

  <script>
    const chartContainer = document.getElementById('chart-container');
    const symbolSelect = document.getElementById('symbol-select');
    const drawBtn = document.getElementById('draw-hline-btn');
    const clearBtn = document.getElementById('clear-lines-btn');
    const statusText = document.getElementById('status-text');

    let isDrawMode = false;
    let priceLines = [];
    let currentSymbol = symbolSelect.value;

    const chart = LightweightCharts.createChart(chartContainer, {
      layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: '#2a2e39' },
      timeScale: { borderColor: '#2a2e39', timeVisible: true },
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#26a69a', downColor: '#ef5350',
      borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    });

    function getStorageKey() {
      return `chart_lines_${currentSymbol}`;
    }

    function saveLinesToLocal() {
      const prices = priceLines.map(line => line.options().price);
      localStorage.setItem(getStorageKey(), JSON.stringify(prices));
    }

    function addHorizontalLine(price, save = true) {
      const line = candleSeries.createPriceLine({
        price: price,
        color: '#2962ff',
        lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.Solid,
        axisLabelVisible: true,
        title: '支撐/壓力',
      });
      priceLines.push(line);
      if (save) saveLinesToLocal();
    }

    function clearAllLines(clearStorage = true) {
      priceLines.forEach(line => candleSeries.removePriceLine(line));
      priceLines = [];
      if (clearStorage) localStorage.removeItem(getStorageKey());
    }

    function loadSavedLines() {
      clearAllLines(false);
      const saved = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
      saved.forEach(price => addHorizontalLine(price, false));
    }

    async function loadMarketData(symbol) {
      statusText.textContent = `正在載入 ${symbol} K 線資料...`;
      try {
        const res = await fetch(`https://binance.com{symbol}&interval=1h&limit=200`);
        const data = await res.json();
        const candles = data.map(item => ({
          time: Number(item.at(0)) / 1000,
          open: Number(item.at(1)),
          high: Number(item.at(2)),
          low: Number(item.at(3)),
          close: Number(item.at(4)),
        }));
        candleSeries.setData(candles);
        chart.timeScale().fitContent();
        loadSavedLines();
        statusText.textContent = `已載入 ${symbol} (1小時K) | 已恢復 ${priceLines.length} 條畫線`;
      } catch (err) {
        statusText.textContent = '載入資料失敗，請檢查網路連線。';
      }
    }

    drawBtn.addEventListener('click', () => {
      isDrawMode = !isDrawMode;
      drawBtn.classList.toggle('active', isDrawMode);
      statusText.textContent = isDrawMode
        ? '🟢 畫線模式開啟：請在圖表上點擊想要標記的價格位置'
        : '提示：點擊上方「點擊畫水平線」後，在圖表任意價位點擊即可畫線。';
    });

    clearBtn.addEventListener('click', () => {
      clearAllLines(true);
      statusText.textContent = '已清除此商品的所有畫線。';
    });

    chart.subscribeClick((param) => {
      if (!isDrawMode || !param.point) return;
      const price = candleSeries.coordinateToPrice(param.point.y);
      if (price !== null) {
        addHorizontalLine(Number(price.toFixed(2)), true);
        isDrawMode = false;
        drawBtn.classList.remove('active');
        statusText.textContent = `已新增水平線於價格 ${price.toFixed(2)}（已自動保存）`;
      }
    });

    symbolSelect.addEventListener('change', (e) => {
      currentSymbol = e.target.value;
      loadMarketData(currentSymbol);
    });

    window.addEventListener('resize', () => {
      chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
    });

    loadMarketData(currentSymbol);
  </script>
</body>
</html>
