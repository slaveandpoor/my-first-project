<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全球全市場雲端看盤系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #131722; color: #d1d4dc; font-family: sans-serif; display: flex; flex-direction: column; }
    header { flex: 0 0 auto; min-height: 50px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 6px 14px; background: #1e222d; border-bottom: 1px solid #2a2e39; gap: 6px; }
    .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    h1 { font-size: 15px; color: #fff; }
    #status-badge { font-size: 12px; padding: 4px 10px; border-radius: 4px; background: #2a2e39; color: #4caf50; }
    select, input, button { background: #2a2e39; color: #d1d4dc; border: 1px solid #363a45; padding: 5px 8px; border-radius: 4px; font-size: 13px; }
    input { width: 145px; }
    button { cursor: pointer; }
    button.active { background: #2962ff; color: #fff; }
    button.danger { background: #b22833; color: #fff; }
    #charts-wrapper { flex: 1 1 auto; display: flex; flex-direction: column; width: 100%; min-height: 0; overflow: hidden; }
    #chart-container { flex: 4 1 0; width: 100%; min-height: 0; position: relative; border-bottom: 2px solid #2a2e39; }
    #volume-container { flex: 1 1 0; width: 100%; min-height: 0; position: relative; }
  </style>
</head>
<body>
  <header>
    <div class="group">
      <h1>📈 全球看盤</h1>
      <select id="symbol-select">
        <optgroup id="fav-group" label="⭐ 我的雲端自選股"></optgroup>
        <optgroup label="🇹🇼 台灣指數與熱門股">
          <option value="^TWII">台灣加權指數 (^TWII)</option>
          <option value="^TWOII">台灣櫃買指數 (^TWOII)</option>
          <option value="2330.TW" selected>台積電 (2330)</option>
          <option value="0050.TW">元大台灣50 (0050)</option>
          <option value="00878.TW">國泰永續高股息 (00878)</option>
          <option value="8069.TWO">元太-上櫃 (8069)</option>
        </optgroup>
        <optgroup label="🇺🇸 美國指數與熱門股">
          <option value="^GSPC">標普 500 (^GSPC)</option>
          <option value="^IXIC">那斯達克綜合 (^IXIC)</option>
          <option value="^DJI">道瓊工業 (^DJI)</option>
          <option value="^SOX">費城半導體 (^SOX)</option>
          <option value="^VIX">VIX 恐慌指數 (^VIX)</option>
          <option value="NVDA">NVIDIA (NVDA)</option>
          <option value="SPY">SPY ETF</option>
          <option value="QQQ">QQQ ETF</option>
        </optgroup>
        <optgroup label="🌏 亞歐全球主要指數">
          <option value="^N225">日本日經 225 (^N225)</option>
          <option value="^KS11">韓國 KOSPI (^KS11)</option>
          <option value="^HSI">香港恆生指數 (^HSI)</option>
          <option value="000001.SS">中國上證指數 (000001.SS)</option>
          <option value="^GDAXI">德國 DAX (^GDAXI)</option>
          <option value="^FTSE">英國富時 100 (^FTSE)</option>
          <option value="^FCHI">法國 CAC 40 (^FCHI)</option>
        </optgroup>
        <optgroup label="🪙 加密貨幣">
          <option value="BTCUSDT">BTC / USDT</option>
          <option value="ETHUSDT">ETH / USDT</option>
        </optgroup>
      </select>
      <input id="custom-symbol" type="text" placeholder="輸入台股數字/美股代號" />
      <button id="search-btn">查詢</button>
      <button id="fav-btn" title="加入或移除雲端自選">⭐ 自選</button>
      <select id="interval-select">
        <option value="60m">1小時K</option>
        <option value="1d" selected>日線K</option>
        <option value="1wk">週線K</option>
        <option value="1mo">月線K</option>
      </select>
      <span id="status-badge">⏳ 啟動中...</span>
    </div>
    <div class="group">
      <select id="color-select"><option value="#2962ff">🔵 藍線</option><option value="#26a69a">🟢 綠線</option><option value="#ef5350">🔴 紅線</option><option value="#ffeb3b">🟡 黃線</option></select>
      <button id="draw-hline-btn">➕ 畫水平線</button>
      <button id="clear-lines-btn" class="danger">🗑️ 清除雲端</button>
    </div>
  </header>
  <div id="charts-wrapper">
    <div id="chart-container"></div>
    <div id="volume-container"></div>
  </div>
  <script src="./app.js?v=15"></script>
</body>
</html>
